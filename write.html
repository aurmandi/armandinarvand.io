<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>write post</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body { background: #72825A; color: white; font-family: 'Roboto Mono', monospace; font-size: 14px; padding: 40px; max-width: 700px; margin: auto; }
        #editor { min-height: 250px; border: 1px dashed white; padding: 12px; margin: 15px 0; outline: none; }
        #editor img { max-width: 100%; display: block; margin: 10px 0; }
        input, button { font-family: inherit; font-size: 14px; padding: 6px 10px; }
        input[type=password] { width: 100%; }
        .row { margin: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 8px; }
        .row button { margin-left: 8px; }
        #status { margin-top: 10px; color: #b6ccfe; }
    </style>
</head>
<body>
    <h1>new blog post</h1>
    <label>github token (saved in this browser only)<br><input type="password" id="token"></label>
    <div id="editor" contenteditable="true"></div>
    <input type="file" id="file" accept="image/*" multiple>
    <button id="publish">publish</button>
    <div id="status"></div>

    <h1 style="margin-top:50px">my posts</h1>
    <button id="load">load posts</button>
    <div id="list"></div>

    <script>
        const REPO = 'aurmandi/armandinarvand.io', PATH = 'posts.json';
        const api = `https://api.github.com/repos/${REPO}/contents/${PATH}`;
        const editor = document.getElementById('editor'), status = document.getElementById('status');
        const tokenInput = document.getElementById('token');
        try { tokenInput.value = localStorage.getItem('gh-token') || ''; } catch (e) {}

        // ponytail: images inlined as downscaled jpeg data urls in posts.json; move to separate files if posts.json passes a few MB
        function addImage(file) {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, 1200 / img.width);
                const c = document.createElement('canvas');
                c.width = img.width * scale; c.height = img.height * scale;
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                editor.focus();
                document.execCommand('insertHTML', false, `<img src="${c.toDataURL('image/jpeg', 0.8)}">`);
                URL.revokeObjectURL(img.src);
            };
            img.src = URL.createObjectURL(file);
        }

        editor.addEventListener('paste', e => {
            const files = [...e.clipboardData.files].filter(f => f.type.startsWith('image/'));
            if (files.length) { e.preventDefault(); files.forEach(addImage); }
        });
        document.getElementById('file').onchange = e => [...e.target.files].forEach(addImage);

        function toBase64(str) {
            const bytes = new TextEncoder().encode(str);
            let bin = '';
            for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
            return btoa(bin);
        }

        // read posts.json, apply change(posts), commit back; returns the new list
        async function update(change, message) {
            const token = tokenInput.value.trim();
            if (!token) throw 'need token';
            try { localStorage.setItem('gh-token', token); } catch (e) {}
            const headers = { Authorization: `Bearer ${token}` };
            const meta = await fetch(api, { headers, cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status));
            let posts = await fetch(api, { headers: { ...headers, Accept: 'application/vnd.github.raw' }, cache: 'no-store' }).then(r => r.json());
            posts = change(posts);
            if (message) {
                const res = await fetch(api, {
                    method: 'PUT', headers,
                    body: JSON.stringify({ message, content: toBase64(JSON.stringify(posts, null, 1)), sha: meta.sha })
                });
                if (!res.ok) throw res.status;
            }
            return posts;
        }

        function render(posts) {
            const list = document.getElementById('list');
            list.innerHTML = '';
            posts.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach(p => {
                const row = document.createElement('div');
                row.className = 'row';
                const text = document.createElement('div');
                text.innerHTML = p.html;
                row.textContent = new Date(p.date).toLocaleString('en-GB') + ' — ' + (text.textContent.slice(0, 60) || '[image]') + ' ';
                const del = document.createElement('button');
                del.textContent = 'delete';
                del.onclick = () => run('deleting...', 'deleted.', () => {
                    if (!confirm('delete this post?')) throw 'cancelled';
                    return update(ps => ps.filter(x => x.date !== p.date), 'Delete blog post');
                });
                row.appendChild(del);
                list.appendChild(row);
            });
        }

        async function run(busy, done, fn) {
            status.textContent = busy;
            try { render(await fn()); status.textContent = done; }
            catch (err) { status.textContent = 'failed: ' + err; }
        }

        document.getElementById('publish').onclick = () => run('publishing...', 'published! live on the site in ~1 minute.', async () => {
            if (!editor.innerHTML.trim()) throw 'need text';
            const posts = await update(ps => [...ps, { date: new Date().toISOString(), html: editor.innerHTML }], 'New blog post');
            editor.innerHTML = '';
            return posts;
        });
        document.getElementById('load').onclick = () => run('loading...', '', () => update(ps => ps));
    </script>
</body>
</html>
